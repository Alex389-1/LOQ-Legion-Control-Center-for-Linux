<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>

    <!-- Primary Accent Gradient (Electric Blue -> Neon Cyan) -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Inner Core Glow Gradient -->
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <!-- Outer Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Container Badge -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" stroke="#27272a" stroke-width="6"/>

  <!-- Subtle Inner Ring -->
  <rect x="48" y="48" width="416" height="416" rx="84" fill="none" stroke="#27272a" stroke-width="2" opacity="0.6"/>

  <!-- Legion/LOQ Outer Angular Polygon Ring -->
  <path d="M 256 96 L 384 160 L 384 320 L 256 416 L 128 320 L 128 160 Z" 
        fill="none" 
        stroke="url(#accentGrad)" 
        stroke-width="16" 
        stroke-linejoin="round" 
        stroke-linecap="round"
        filter="url(#glow)"/>

  <!-- CPU/GPU Die Grid Pattern Lines -->
  <g stroke="#3f3f46" stroke-width="3" opacity="0.5">
    <line x1="256" y1="96" x2="256" y2="150"/>
    <line x1="256" y1="362" x2="256" y2="416"/>
    <line x1="128" y1="240" x2="182" y2="240"/>
    <line x1="330" y1="240" x2="384" y2="240"/>
  </g>

  <!-- Central High-Tech LOQ Core Circle -->
  <circle cx="256" cy="240" r="72" fill="#09090b" stroke="url(#accentGrad)" stroke-width="12"/>

  <!-- Inner Power Bolt Symbol -->
  <path d="M 268 184 L 224 244 L 252 244 L 240 296 L 288 236 L 260 236 Z" 
        fill="url(#coreGrad)" 
        stroke="#38bdf8" 
        stroke-width="2" 
        stroke-linejoin="round"/>

  <!-- Bottom LOQ Emblem Accent Dot -->
  <circle cx="340" cy="324" r="14" fill="#06b6d4" />
</svg>
